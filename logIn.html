<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Login Page</title> <style> body { font-family: Arial, sans-serif; background: #f3f3f3; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
.login-container {
  background: gray;
  padding: 2rem;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  width: 300px;
}

.login-container h2 {
  text-align: center;
  margin-bottom: 1.5rem;
  color: #333;
}

.login-container input[type="text"],
.login-container input[type="password"] {
  width: 100%;
  padding: 0.75rem;
  margin: 0.5rem 0;
  border: 1px solid #ccc;
  border-radius: 5px;
  box-sizing: border-box;
}

.login-container input[type="submit"] {
  width: 100%;
  background-color: #007bff;
  color: white;
  padding: 0.75rem;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
}

.login-container input[type="submit"]:hover {
  background-color: #0056b3;
}

.login-container .links {
  text-align: center;
  margin-top: 1rem;
}

.login-container .links a {
  color: #007bff;
  text-decoration: none;
  font-size: 0.9rem;
}

.login-container .links a:hover {
  text-decoration: underline;
}

</style> </head> <body> <div class="login-container"> <h2>Login</h2> <form action="/login" method="post"> <label for="username">Username</label> <input type="text" id="username" name="username" placeholder="Enter your username" required>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" placeholder="Enter your password" required>

  <input type="submit" value="Login">
</form>

<div class="links">
  <a href="#">Forgot password?</a><br>
  <a href="#">Create an account</a>
</div>

</div> </body> </html>
